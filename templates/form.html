<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22d3ee;
      --accent-2: #60a5fa;
      --ring: rgba(34, 211, 238, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1000px 600px at 10% 10%, rgba(34,211,238,0.15), transparent),
                  radial-gradient(900px 500px at 90% 90%, rgba(96,165,250,0.15), transparent),
                  var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
    }
    .title {
      margin: 0 0 6px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 0.95rem;
    }
    .field {
      position: relative;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(17,24,39, 0.65);
      color: var(--text);
      outline: none;
      transition: box-shadow 0.2s, border-color 0.2s, background 0.2s;
    }
    input::placeholder { color: #9aa0a6; }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
      background: rgba(17,24,39, 0.9);
    }
    .toggle-eye {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
    }
    .row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
    }
    .actions {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }
    button[type="submit"] {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b1020;
      box-shadow: 0 10px 18px rgba(34, 211, 238, 0.25);
      transition: transform 0.08s ease, filter 0.2s ease;
    }
    button[type="submit"]:active { transform: translateY(1px); }
    a.link { color: var(--accent-2); text-decoration: none; }
    a.link:hover { text-decoration: underline; }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }
    .footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <form class="card" action="#" method="post" onsubmit="demoSubmit(event)">
    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Sign in with your username and password.</p>

    <label for="username">Username</label>
    <div class="field">
      <input
        type="text"
        id="username"
        name="username"
        placeholder="e.g. nand_kishor"
        minlength="3"
        maxlength="32"
        required
        autocomplete="username"
      />
    </div>

    <label for="password">Password</label>
    <div class="field">
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Your secure password"
        minlength="6"
        required
        autocomplete="current-password"
      />
      <button class="toggle-eye" type="button" aria-label="Show password" onclick="togglePassword()">👁️</button>
    </div>

    <div class="row">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" name="remember" /> Remember me
      </label>
      <a class="link" href="#" onclick="alert('Demo only'); return false;">Forgot password?</a>
    </div>

    <div class="actions">
      <button type="submit">Sign In</button>
      <p class="hint">This is a front-end demo. Replace the <code>onsubmit</code> handler to send data to your backend.</p>
    </div>

    <div class="footer">No account? <a class="link" href="#" onclick="alert('Demo only'); return false;">Create one</a></div>
  </form>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const btn = event.currentTarget;
      const isHidden = pwd.type === 'password';
      pwd.type = isHidden ? 'text' : 'password';
      btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      btn.textContent = isHidden ? '🙈' : '👁️';
    }

    function demoSubmit(e) {
      e.preventDefault();
      const form = e.currentTarget;
      const data = Object.fromEntries(new FormData(form).entries());
      alert(`Demo login submitted\nUsername: ${data.username}\nPassword: ${data.password}\nRemember: ${data.remember ? 'Yes' : 'No'}`);
    }
  </script>
</body>
</html>
